<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Courier Express quickstart</title>
  </head>
  <body style="max-width: 40rem; margin: 2rem auto; font-family: system-ui, sans-serif">
    <h1>Notifications</h1>
    <courier-inbox height="32rem"></courier-inbox>

    <script type="module">
      // Importing it registers <courier-inbox>. jsDelivr's +esm build needs no bundler.
      import { Courier } from "https://cdn.jsdelivr.net/npm/@trycourier/courier-ui-inbox@2.7.4/+esm";

      const response = await fetch("/courier/token");
      if (!response.ok) throw new Error(`GET /courier/token returned ${response.status}`);
      const { userId, token } = await response.json();

      Courier.shared.signIn({ userId, jwt: token });
    </script>
  </body>
</html>
